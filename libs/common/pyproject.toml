[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "commerce-common"
version = "0.1.0"
description = "Shared helpers for the Distributed Commerce & Payments Engine"
requires-python = ">=3.11"
dependencies = [
    "PyJWT>=2.8",
    "bcrypt>=4.1",
    "pika>=1.3",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "prometheus-client>=0.20",
    "starlette>=0.37",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-instrumentation-httpx>=0.48b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.48b0",
    # The SQLAlchemy instrumentation (0.66b0) supports only < 2.1; above that it
    # refuses to load and database spans silently disappear. Raise together.
    "sqlalchemy>=2.0,<2.1",
]

[tool.setuptools.packages.find]
include = ["commerce_common*"]
