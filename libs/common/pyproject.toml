[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "commerce-common"
version = "0.1.0"
description = "Shared helpers for the Distributed Commerce & Payments Engine"
requires-python = ">=3.11"
dependencies = [
    "PyJWT>=2.8",
    "bcrypt>=4.1",
]

[tool.setuptools.packages.find]
include = ["commerce_common*"]
