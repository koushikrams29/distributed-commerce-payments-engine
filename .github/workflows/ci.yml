name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes an in-flight run obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      # One service failing should not hide the results of the others.
      fail-fast: false
      matrix:
        service:
          - order-service
          - gateway
          - inventory-service
          - payment-service
          - notification-service
          - recommendation-service

    defaults:
      run:
        working-directory: services/${{ matrix.service }}

    env:
      # Required because app.core.config validates settings at import time.
      # Never actually connected to: integration tests start a throwaway
      # Postgres via testcontainers and point the app at that instead.
      DATABASE_URL: postgresql+psycopg2://ci:ci@localhost:5432/ci
      JWT_SECRET: ci-only-test-secret-at-least-32-chars
      SEED_DEV_USERS: "false"
      INVENTORY_SERVICE_URL: http://inventory.test
      PAYMENT_SERVICE_URL: http://payment.test
      USE_EVENT_BUS: "false"

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest

  common:
    name: Test commerce-common
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: libs/common

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: libs/common/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # Integration tests start a throwaway RabbitMQ via testcontainers.
      - name: Run tests
        run: pytest

  frontend:
    name: Test admin dashboard
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      # Type-checks first, so a type error fails here even if tests pass.
      - name: Build
        run: npm run build
