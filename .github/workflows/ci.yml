name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes an in-flight run obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      # One service failing should not hide the results of the others.
      fail-fast: false
      matrix:
        service:
          - order-service
          - gateway
          - inventory-service
          - payment-service
          - notification-service
          - recommendation-service

    defaults:
      run:
        working-directory: services/${{ matrix.service }}

    env:
      # Required because app.core.config validates settings at import time.
      # Never actually connected to: integration tests start a throwaway
      # Postgres via testcontainers and point the app at that instead.
      DATABASE_URL: postgresql+psycopg2://ci:ci@localhost:5432/ci
      JWT_SECRET: ci-only-test-secret-at-least-32-chars
      SEED_DEV_USERS: "false"
      INVENTORY_SERVICE_URL: http://inventory.test
      PAYMENT_SERVICE_URL: http://payment.test
      USE_EVENT_BUS: "false"

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: |
          echo "### Coverage: ${{ matrix.service }}" >> "$GITHUB_STEP_SUMMARY"
          pytest --cov=app --cov-branch --cov-report=term-missing:skip-covered \
            --cov-report="markdown-append:$GITHUB_STEP_SUMMARY" --cov-fail-under=85

  common:
    name: Test commerce-common
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: libs/common

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: libs/common/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # Integration tests start a throwaway RabbitMQ via testcontainers.
      - name: Run tests
        run: |
          echo "### Coverage: commerce-common" >> "$GITHUB_STEP_SUMMARY"
          pytest --cov=commerce_common --cov-branch --cov-report=term-missing:skip-covered \
            --cov-report="markdown-append:$GITHUB_STEP_SUMMARY" --cov-fail-under=85

  locks:
    name: Dependency locks up to date
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # Same version as used locally: other versions may format locks differently.
      - name: Install uv
        run: pip install "uv==0.12.22"

      # Existing pins are kept, so this only changes a lock whose .in file was
      # edited without regenerating it.
      - name: Regenerate locks
        run: python scripts/lock_requirements.py

      - name: Fail if a lock is stale
        run: git diff --exit-code -- '*requirements*.txt'

  e2e:
    name: End-to-end (containers)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: infra

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      # Development-only values; the runner is thrown away afterwards.
      - name: Configure the stack
        run: cp .env.example .env

      # The production files only run on the server, so check here that they still parse.
      - name: Validate the production overlay and Caddyfile
        env:
          SITE_ADDRESS: demo.example.com
          DEMO_ADMIN_PASSWORD: ci
          DEMO_SHOPPER_PASSWORD: ci
          GRAFANA_ADMIN_PASSWORD: ci
        run: |
          docker compose -f docker-compose.yml -f docker-compose.app.yml -f docker-compose.prod.yml config --quiet
          docker run --rm -e SITE_ADDRESS -v "$PWD/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: Build images and start the stack
        run: docker compose -f docker-compose.yml -f docker-compose.app.yml up -d --build --wait --wait-timeout 300

      - name: Install smoke test dependencies
        run: pip install -r ../scripts/requirements.txt

      - name: Place an order through the dashboard proxy
        run: python ../scripts/smoke_test.py

      - name: Service logs
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.app.yml logs --no-color

  frontend:
    name: Test admin dashboard
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      # Type-checks first, so a type error fails here even if tests pass.
      - name: Build
        run: npm run build
